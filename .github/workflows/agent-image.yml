name: agent image
on:
  push:
    branches: [main]
    # The recipe, not the declaration: editing .patchy/agent.yaml alone does
    # not rebuild the immutable toolchain tag it names.
    paths: ['.patchy/Dockerfile', 'go.mod', '.dockerignore', '.github/workflows/agent-image.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Uncredentialed toolchain build
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            -f .patchy/Dockerfile --output "type=oci,dest=$RUNNER_TEMP/agent.oci.tar" .
          python3 .github/publish/validate_oci.py "$RUNNER_TEMP/agent.oci.tar" "$RUNNER_TEMP/agent-validated" agent
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent.oci.tar
          retention-days: 3
          if-no-files-found: error

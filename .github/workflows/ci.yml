name: test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A PR's newer push supersedes its older run. Main is different: every main
# commit must build and publish its own runtime image (a preview of an
# unchanged repository runs main's image), so each main commit gets a group of
# its own and is never cancelled or replaced as a pending run.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - name: Test the app and the publishers' rejection rules
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          node --test .github/publish/guard.test.cjs
          python3 -m unittest discover -s .github/publish -p 'test_*.py'
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact head without credentials or OIDC
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --build-arg BUILD_SHA="$BUILD_SHA" \
            --output "type=oci,dest=$RUNNER_TEMP/runtime.oci.tar" .
          python3 .github/publish/validate_oci.py "$RUNNER_TEMP/runtime.oci.tar" "$RUNNER_TEMP/runtime-validated" runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime.oci.tar
          retention-days: 3
          if-no-files-found: error
